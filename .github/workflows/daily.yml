name: Daily RBF-KAN-Transformer Run

on:
  schedule:
    - cron: '10 00 * * 1-6'
  workflow_dispatch:

jobs:
  run-rbf-kan-transformer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run RBF-KAN-Transformer Engine
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python trainer.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbf-kan-transformer-results
          path: |
            rbf_kan_transformer_*.json
            rbf_kan_transformer_breakdown_*.json
